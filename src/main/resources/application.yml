server:
  port: 8080

spring:
  application:
    name: quant-trading-assistant
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/quant_trading_assistant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 111111
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 1
      password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

knife4j:
  enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

quant:
  auth:
    token-expire-hours: 2
